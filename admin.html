<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 관리자 대시보드</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }
        body {
            background-color: #f4f6f8;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }
        .header h1 {
            font-size: 22px;
            color: #333;
        }
        .btn-refresh {
            padding: 8px 14px;
            background: #2196F3;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .order-card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            border-left: 5px solid #ff5722;
        }
        .order-card.completed {
            border-left-color: #4caf50;
            opacity: 0.8;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .order-body {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
        }
        .order-actions {
            display: flex;
            gap: 8px;
        }
        .btn-complete {
            flex: 1;
            padding: 10px;
            background: #4caf50;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-delete {
            padding: 8px 12px;
            background: #f44336;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .empty-msg {
            text-align: center;
            color: #888;
            padding: 50px 0;
            font-size: 16px;
        }
        .completed-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🖥️ 매장 주문 관리자</h1>
        <button class="btn-refresh" onclick="renderAdminOrders()">🔄 새로고침</button>
    </div>

    <div id="admin-order-list">
        <!-- 주문 목록이 표시됩니다 -->
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:3000/api/orders';

        window.onload = function() {
            renderAdminOrders();
            setInterval(renderAdminOrders, 3000);
        };

        async function renderAdminOrders() {
            const container = document.getElementById('admin-order-list');
            try {
                const response = await fetch(API_BASE_URL);
                const orders = await response.json();

                if (orders.length === 0) {
                    container.innerHTML = '<div class="empty-msg">들어온 주문이 없습니다.</div>';
                    return;
                }

                container.innerHTML = orders.map(order => {
                    let itemsStr = [];
                    if (order.fries > 0) itemsStr.push(`갈릭버터 감자튀김 ${order.fries}개`);
                    if (order.drink > 0) itemsStr.push(`블루레몬에이드 ${order.drink}개`);
                    if (order.set_menu > 0) itemsStr.push(`세트 ${order.set_menu}개`);

                    const isCompleted = order.status === '조리완료';

                    const timeStr = new Date(order.created_at.replace(' ', 'T') + 'Z').toLocaleTimeString('ko-KR', {
                        hour: '2-digit', minute: '2-digit', second: '2-digit'
                    });

                    return `
                        <div class="order-card ${isCompleted ? 'completed' : ''}">
                            <div class="order-header">
                                <span>주문번호 #${order.id} (${timeStr})</span>
                                <span style="color: ${isCompleted ? '#4caf50' : '#ff5722'}">${order.status}</span>
                            </div>
                            <div class="order-body">
                                <p><strong>메뉴:</strong> ${itemsStr.join(', ')}</p>
                                <p><strong>금액:</strong> ${order.total_price.toLocaleString()}원</p>
                            </div>
                            ${!isCompleted ? `
                                <div class="order-actions">
                                    <button class="btn-complete" onclick="updateOrderStatus(${order.id}, '조리완료')">조리 완료</button>
                                </div>
                            ` : `
                                <div class="completed-footer">
                                    <span style="color:#4caf50; font-size:13px; font-weight:bold;">✓ 완료된 주문</span>
                                    <button class="btn-delete" onclick="deleteOrder(${order.id})">🗑️ 삭제</button>
                                </div>
                            `}
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('목록 조회 실패:', error);
                container.innerHTML = '<div class="empty-msg" style="color:red;">서버 연결 불가</div>';
            }
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                const response = await fetch(`${API_BASE_URL}/${orderId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    renderAdminOrders();
                }
            } catch (error) {
                console.error('상태 업데이트 실패:', error);
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm(`주문번호 #${orderId} 건을 정말 삭제하시겠습니까?`)) return;

            try {
                const response = await fetch(`${API_BASE_URL}/${orderId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    renderAdminOrders();
                } else {
                    alert('삭제 처리 중 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('주문 삭제 실패:', error);
                alert('서버와 통신할 수 없습니다.');
            }
        }
    </script>
</body>
</html>
